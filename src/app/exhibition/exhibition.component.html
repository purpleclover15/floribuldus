
<div class="modal-body row px-2 px-md-4 py-3 artwork-detail-padding"
     *ngIf="exhibition">

  <!-- IMAGE -->
  <div class="col-12 col-md-6 order-2 order-md-1 d-flex justify-content-center">

    <img
      [src]="image(exhibition.exhibitionCover)"
      [alt]="exhibition.title"
      (click)="showFullImage(exhibition.exhibitionCover)"
      style="max-width: 100%; max-height: 80vh; object-fit: contain; cursor: zoom-in;">
  </div>

  <!-- CONTENT -->
  <div class="col-12 col-md-6 order-1 order-md-2 px-3">

    <h1>{{ exhibition.title }}</h1>
    
    <!-- LANGUAGE TOGGLE -->
    <div class="lang-toggle btn-group mb-3" role="group">

      <input
        type="radio"
        class="btn-check"
        name="lang"
        id="lang-en"
        [checked]="selectedLang === 'en'"
        (change)="onLangChange('en')">

      <label class="lang-btn" for="lang-en">
        English
      </label>

      <input
        type="radio"
        class="btn-check"
        name="lang"
        id="lang-ro"
        [checked]="selectedLang === 'ro'"
        (change)="onLangChange('ro')">

      <label class="lang-btn" for="lang-ro">
        Română
      </label>

    </div>

    <!-- AUDIO CARD -->
    <div class="artist-audio-card mt-4">

      <h3>{{ audioText[selectedLang].title }}</h3>

      <p>{{ audioText[selectedLang].description }}</p>

      <!-- IF AUDIO EXISTS -->
      <ng-container *ngIf="exhibition.audio?.[selectedLang]; else comingSoon">

    <div class="play-button-wrapper">

      <button class="play-button" (click)="play()">

        {{
          (audioService.isPlaying$ | async) &&
          (audioService.currentFile$ | async) ===
            (image(exhibition.audio[selectedLang] || ''))
            ? '⏹ Stop'
            : '▶ Play'
        }}

      </button>

    </div>

        <input
          type="range"
          min="0"
          max="100"
          [value]="audioService.progress$ | async"
          (input)="audioService.seek($event)"
        />

        <div class="time">
          {{ audioService.currentTime$ | async | number:'1.0-0' }}s /
          {{ audioService.duration$ | async | number:'1.0-0' }}s
        </div>

      </ng-container>

      <!-- FALLBACK -->
      <ng-template #comingSoon>
        <div class="coming-soon-box">
          🎧 Audio coming soon in {{ selectedLang === 'en' ? 'English' : 'Română' }}
        </div>
      </ng-template>

    </div>

  </div>
</div>

<!-- MODAL -->
<div class="modal fade" id="fullImageModal">

  <div class="modal-dialog modal-dialog-centered modal-xl"
       (click)="closeFullImage()">

    <div class="modal-content bg-transparent border-0">

      <div class="modal-body text-center p-0">

        <img
          [src]="fullImageUrl"
          class="img-fluid"
          [alt]="exhibition?.title"
          style="max-height: 90vh; object-fit: contain;" />

      </div>

    </div>

  </div>
</div>
